[general]
static=no
writeprotect=no
clearglobalvars=no

[internal]
; --- LOCAL TEST: auto-answer the stand-in CALLER only (silent, free). The human
; --- number is intentionally NOT intercepted, so it routes OUT via the real
; --- trunk and a real phone rings. REMOVE this caller line before commit/deploy.
exten => 8000000001,1,NoOp(TEST caller leg auto-answer)
 same => n,Answer()
 same => n,Wait(120)
 same => n,Hangup()
; ---------------------------------------------------------------------------
; Human transfer via SIP REFER. The media server sends a REFER with
;   Refer-To: sip:xfer<number>@asterisk
; on the live caller's dialog. Asterisk runs this extension (the media endpoint's
; context) to dial the SECOND human and bridge them to the first human (already
; connected). No new call leg is created by the media server.
;   <number> = the second human's number (digits only; the "xfer" prefix marks it
;              as a transfer target so it doesn't collide with normal numbers).
; The outbound trunk/provider is carried on the (now transferred) first-human leg
; via the inherited REFERPROVIDER/REFERDID channel vars set in [default] below;
; falls back to synchrovox_out for this single-trunk setup.
; NOTE: the Refer-To user-part is literally "xfer<number>". In a dialplan PATTERN,
; the letters X/Z/N are special (case-insensitive: lowercase 'x' means "a digit"),
; so a literal 'x' must be written as the character class [x]. Hence _[x]fer. (not
; _xfer., which would mean digit-f-e-r and never match a literal "xfer" prefix).
exten => _[x]fer.,1,NoOp(Hand REFER to provider for ${EXTEN:4} (prov=${REFERPROVIDER}))
 ; Asterisk's ONLY job here is to pass the REFER to the provider. The PROVIDER
 ; performs the transfer and connects person1 <-> person2 on its own network.
 ; Asterisk does NOT bridge, does NOT Dial, does NOT handle the transfer itself.
 same => n,GotoIf($["${REFERPROVIDER}" != ""]?go)
 same => n,Set(REFERPROVIDER=synchrovox_out)
 same => n,Set(REFERDID=00919240292847)
 same => n(go),Set(CALLERID(num)=${REFERDID})
 same => n,Set(CALLERID(name)=${REFERDID})
 ; Bridge the call locally instead of using SIP REFER to the provider
 same => n,Dial(PJSIP/${EXTEN:4}@${REFERPROVIDER},120)
 same => n,Hangup()
; ---------------------------------------------------------------------------
; Check for outbound calls with X-Trunk header first
exten => _X.,1,NoOp(Call from internal context to ${EXTEN})
same => n,Set(TRUNK=${PJSIP_HEADER(read,X-Trunk)})
same => n,GotoIf($["${TRUNK}" != ""]?default,${EXTEN},1)  ; If X-Trunk exists, go to default context
; Handle internal calls if no X-Trunk header
same => n,Dial(PJSIP/${EXTEN},30)
same => n,Hangup()

; Handle pjsip_client and india_media calls
exten => pjsip_client,1,NoOp(Dialing pjsip_client)
exten => pjsip_client,n,Dial(PJSIP/pjsip_client,30)
exten => pjsip_client,n,Hangup()

exten => india_media,1,NoOp(Dialing india_media)
exten => india_media,n,Dial(PJSIP/india_media,30)
exten => india_media,n,Hangup()

[from-trunk]
; Handle incoming calls from SIP trunk.
; CLEAN_TRUNK is always set to ps_provider_dids.id (the trunk_name / DID-row id),
; matching the outbound convention where X-Trunk = ps_provider_dids.id.
;
; Two routing paths depending on how the provider identifies the call:
;   A) IP-identified providers (e.g. Elision) put the DID number in the To: URI.
;      -> ${EXTEN} is the DID, lookup is ps_provider_dids.did -> id
;   B) Registration-based providers (e.g. Tata) put the registration username
;      in the To: URI.
;      -> ${EXTEN} is the username; chain through ps_registrations.endpoint
;         then ps_provider_dids.provider_id -> id

;exten => _X.,1,NoOp(Incoming call, raw EXTEN: ${EXTEN})
;same => n,Set(_INBOUND_KEY=${EXTEN})
exten => _[0-9#].,1,NoOp(Incoming call, raw EXTEN: ${EXTEN})

; If EXTEN starts with 10#, strip it
same => n,GotoIf($["${EXTEN:0:3}" = "10#"]?striphash)

; Normal DID
same => n,Set(_INBOUND_KEY=${EXTEN})
same => n,Goto(normalized)

; Remove 10#
same => n(striphash),Set(_INBOUND_KEY=${EXTEN:3})

same => n(normalized),NoOp(Normalized inbound key: ${INBOUND_KEY})

; Path A: ${EXTEN} is the DID number
same => n,Set(_CLEAN_TRUNK=${REALTIME_FIELD(ps_provider_dids,did,${INBOUND_KEY},id)})
same => n,Set(_RESOLVED_DID=${INBOUND_KEY})
same => n,GotoIf($["${CLEAN_TRUNK}" != ""]?routed)

; Path B: ${EXTEN} is the registration username -> resolve provider, then DID-row
same => n,Set(_PROVIDER=${REALTIME_FIELD(ps_registrations,contact_user,${INBOUND_KEY},endpoint)})
same => n,GotoIf($["${PROVIDER}" = ""]?notfound)
; Assumes 1 DID row per registration-based provider. If you ever attach
; multiple DIDs to one registration trunk, this picks the first match.
same => n,Set(_CLEAN_TRUNK=${REALTIME_FIELD(ps_provider_dids,provider_id,${PROVIDER},id)})
same => n,Set(_RESOLVED_DID=${REALTIME_FIELD(ps_provider_dids,provider_id,${PROVIDER},did)})
same => n,GotoIf($["${CLEAN_TRUNK}" = ""]?notfound)

same => n(routed),Set(_ORIGINAL_EXTEN=${RESOLVED_DID})
same => n,Set(CALLERID(dnid)=${RESOLVED_DID})
same => n,NoOp(Routing inbound: key=${INBOUND_KEY} trunk=${CLEAN_TRUNK} did=${RESOLVED_DID})
same => n,Set(TARGET_URI=${CURL(http://localhost:8000/get-inbound-contact/asterisk)})
same => n,GotoIf($["${TARGET_URI}" = ""]?lb_failed)
same => n,NoOp(Load balancer selected: ${TARGET_URI})
same => n,Dial(${TARGET_URI},60,b(headers^add^1))
same => n,Hangup()

same => n(notfound),NoOp(No mapping found for inbound EXTEN ${INBOUND_KEY})
same => n,Hangup(1)

same => n(lb_failed),NoOp(Load balancer at localhost:8000 unreachable)
same => n,Hangup(41)

; [from-trunk]
; exten => _X.,1,NoOp(Signaling Test for DID: ${EXTEN})
; same => n,Answer()
; same => n,Wait(60)
; same => n,Hangup()

[headers]
exten => add,1,NoOp(Adding destination number header)
same => n,Set(PJSIP_HEADER(add,X-To-Number)=${ORIGINAL_EXTEN})
same => n,Set(PJSIP_HEADER(add,X-Trunk)=${CLEAN_TRUNK})
same => n,Return()

; Outbound leg-2 (Asterisk -> provider): propagate X-Call-UUID carried
; in from sip_outbound so the provider's webhook can map back to our
; internal UUID. Inherited from caller via _CALL_UUID.
exten => add_uuid,1,NoOp(Propagating X-Call-UUID on leg 2: ${CALL_UUID})
same => n,GotoIf($["${CALL_UUID}" = ""]?done)
same => n,Set(PJSIP_HEADER(add,X-Call-UUID)=${CALL_UUID})
same => n(done),Return()

[default]
; Handle both inbound and outbound calls
exten => _X.,1,NoOp(Call to ${EXTEN})
same => n,Set(TRUNK=${PJSIP_HEADER(read,X-Trunk)})
same => n,GotoIf($["${TRUNK}" != ""]?outbound)
; Handle internal calls first
same => n,GotoIf($["${EXTEN}" = "pjsip_client" || "${EXTEN:0:11}" = "india_media"]?internal,${EXTEN},1)
; Handle inbound calls
same => n,Goto(from-trunk,${EXTEN},1)

; Outbound: X-Trunk now carries the ps_provider_dids.id (a single trunk can host
; multiple DIDs). Resolve it to the provider endpoint and the DID number.
same => n(outbound),NoOp(Outbound call, X-Trunk (did.id): ${TRUNK})
; Capture X-Call-UUID from inbound INVITE; underscore prefix makes it
; inherit to the dialed channel so the b() sub can stamp it on leg 2.
same => n,Set(_CALL_UUID=${PJSIP_HEADER(read,X-Call-UUID)})
; LOCAL TEST: record the bridged human leg (your voice) natively in Asterisk.
; Writes to a CONTAINER-LOCAL path: the Windows bind-mount (/etc/asterisk/rec)
; can't satisfy MixMonitor's WAV file ops (virtiofs), so write to ext4 here and
; docker cp it out. MixMonitor also forces audio through Asterisk (no direct media).
same => n,MixMonitor(/var/spool/asterisk/monitor/human-${CALL_UUID}.wav)
same => n,Set(PROVIDER=${REALTIME_FIELD(ps_provider_dids,id,${TRUNK},provider_id)})
same => n,Set(DID_NUMBER=${REALTIME_FIELD(ps_provider_dids,id,${TRUNK},did)})
; Carry the outbound provider/DID onto the dialed (first-human) leg so a later
; SIP REFER (human transfer) can dial the second human out the SAME trunk. The
; double underscore makes these inherit to the dialed channel and persist across
; the blind-transfer redirect (see [internal] _xfer.).
same => n,Set(__REFERPROVIDER=${PROVIDER})
same => n,Set(__REFERDID=${DID_NUMBER})
same => n,GotoIf($["${PROVIDER}" = ""]?legacy)
same => n,NoOp(Resolved DID ${TRUNK} -> provider=${PROVIDER}, did=${DID_NUMBER})
same => n,Set(CALLERID(num)=${DID_NUMBER})
same => n,Set(CALLERID(name)=${DID_NUMBER})
same => n,Dial(PJSIP/${EXTEN}@${PROVIDER},60,b(headers^add_uuid^1))
same => n,Hangup()

; Fallback: no ps_provider_dids row matched. Treat X-Trunk as a provider/endpoint
; name directly (legacy clients that pass trunk_name = ps_endpoints.id).
same => n(legacy),NoOp(No DID row for ${TRUNK} - dialing X-Trunk as provider directly)
same => n,Dial(PJSIP/${EXTEN}@${TRUNK},60,b(headers^add_uuid^1))
same => n,Hangup()

; ---------------------------------------------------------------------------
; Softphone test context. A softphone (endpoint id 'softphone') registered to
; Asterisk dials a number directly and we route it out through synchrovox_out,
; stamping the trunk's caller-id. No X-Trunk header needed from the client.
;   *43  -> local echo test (verifies softphone<->Asterisk audio only)
;   <num> -> outbound call via the Tata trunk
; ---------------------------------------------------------------------------
[softphone-out]
exten => *43,1,NoOp(Echo test)
same => n,Answer()
same => n,Echo()
same => n,Hangup()

exten => _X.,1,NoOp(Softphone -> ${EXTEN} via synchrovox_out)
; If Tata requires a dialing prefix, change ${EXTEN} below to 0${EXTEN} (or 45454${EXTEN}).
same => n,Set(CALLERID(num)=00919240292847)
same => n,Set(CALLERID(name)=00919240292847)
same => n,Dial(PJSIP/${EXTEN}@synchrovox_out,60)
same => n,Hangup()

