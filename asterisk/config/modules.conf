[modules]
autoload=no

; Core modules
load => res_config_mysql.so
load => pbx_config.so

; Apps used by the dialplan (autoload=no, so these must be explicit)
load => app_mixmonitor.so
; Audio file format handlers (required so MixMonitor can write .wav)
load => format_wav.so
load => format_pcm.so

; Sorcery modules (needed for PJSIP)
load => res_sorcery_config.so
load => res_sorcery_memory.so
load => res_sorcery_astdb.so
load => res_sorcery_realtime.so

; PJSIP dependencies
load => res_pjproject.so

; PJSIP modules
load => res_pjsip.so
load => res_pjsip_acl.so
load => res_pjsip_endpoint_identifier_user.so
load => res_pjsip_endpoint_identifier_ip.so
load => res_pjsip_session.so
load => chan_pjsip.so
load => res_http_websocket.so
load => res_rtp_asterisk.so
load => res_pjsip_registrar.so
load => res_pjsip_outbound_registration.so
load => res_pjsip_authenticator_digest.so
load => res_pjsip_outbound_authenticator_digest.so
load => res_pjsip_transport_websocket.so
load => res_pjsip_nat.so
load => res_pjsip_sdp_rtp.so
load => res_pjsip_pubsub.so
load => res_pjsip_mwi.so           ; Added for Message Waiting Indication support
load => res_pjsip_mwi_body_generator.so ; Added for MWI message body generation
load => res_pjsip_header_funcs.so  ; Added for PJSIP_HEADER function support
load => res_pjsip_caller_id.so     ; Added for caller ID support
load => res_pjsip_refer.so         ; Required for REFER-based blind/attended transfer (human transfer)

; Traditional SIP modules (alongside PJSIP)
load => chan_sip.so              ; Traditional SIP channel driver
load => res_crypto.so            ; Cryptographic functions
load => res_http_post.so         ; HTTP POST support

; Dialplan modules
load => pbx_realtime.so
load => app_dial.so
load => app_transfer.so    ; For Transfer() — sends REFER UPSTREAM to the provider (network/carrier-side transfer)
load => app_playback.so
load => app_stack.so       ; For subroutines and gosub
load => func_callerid.so   ; For CALLERID function
load => func_channel.so    ; For CHANNEL function
load => func_strings.so    ; For string manipulation
load => res_curl.so        ; CURL resource module (dependency)
load => func_curl.so       ; For HTTP requests in dialplan
load => func_realtime.so  ; For REALTIME_FIELD function

; Codec modules
load => codec_ulaw.so
load => codec_alaw.so
load => codec_gsm.so

; Bridge modules
load => bridge_simple.so
load => bridge_native_rtp.so

; Resource modules
load => res_musiconhold.so